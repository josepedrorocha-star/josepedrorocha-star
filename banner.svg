<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#123A5C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- ondas / waves -->
  <path d="M0 215 C 200 175, 400 255, 600 215 S 1000 175, 1200 215 V260 H0 Z" fill="url(#wave)" opacity="0.35"/>
  <path d="M0 235 C 220 205, 420 265, 620 235 S 1000 205, 1200 235 V260 H0 Z" fill="url(#wave)" opacity="0.8"/>

  <!-- símbolo </> no anel / </> symbol in ring -->
  <g transform="translate(150 115)">
    <circle r="62" fill="none" stroke="#14B8A6" stroke-width="10"/>
    <circle cx="44" cy="-44" r="8" fill="#F97316"/>
    <path d="M-20 -22 L-40 0 L-20 22" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 -22 L40 0 L20 22" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 -30 L-8 30" stroke="#F97316" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- texto / text -->
  <text x="260" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">José Pedro Rocha</text>
  <text x="262" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#5EEAD4">Arquiteto &amp; Guitarrista  ·  Architect &amp; Guitarist</text>
  <text x="262" y="182" font-family="Consolas, Menlo, monospace" font-size="17" fill="#CBD5E1">Blueprint &amp; Riff  ·  jprocha-pt</text>
</svg>
